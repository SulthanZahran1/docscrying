<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docscrying</title>
<style>
:root {
  --bg: #0e0e10;
  --panel: #17171b;
  --panel-2: #1d1d22;
  --border: #26262e;
  --border-strong: #3a3a44;
  --text: #dcdce2;
  --text-dim: #a3a3ad;
  --text-faint: #7a7a85;
  --accent: #c9973e;
  --accent-dim: rgba(201, 151, 62, 0.16);
  --radius: 4px;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html, body { overflow-x: hidden; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { touch-action: manipulation; }

/* ---------- pair view ---------- */
#pair-view {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; height: 100dvh; padding: 24px;
}
#pair-card {
  width: 100%; max-width: 380px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  text-align: center;
}
#pair-card h1 {
  font-family: var(--font-mono);
  font-size: 16px; font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
#pair-card p.sub {
  font-size: 12.5px; color: var(--text-dim);
  margin-bottom: 20px;
}
#pair-card input {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  margin-bottom: 12px;
}
#pair-card input:focus { border-color: var(--accent); }
#pair-card input::placeholder { color: var(--text-faint); }
#pair-card button {
  width: 100%;
  background: var(--accent);
  border: none; border-radius: var(--radius);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  padding: 9px 12px;
  cursor: pointer;
  letter-spacing: 0.03em;
}
#pair-card button:disabled { opacity: 0.5; cursor: wait; }
#pair-error {
  display: none;
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--accent);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 8px 10px;
  text-align: left;
  word-break: break-word;
}
#pair-error.show { display: block; }

/* ---------- reader app ---------- */
#app {
  display: none;
  grid-template-columns: 320px 1fr;
  grid-template-rows: 44px 1fr 26px;
  height: 100vh; height: 100dvh;
  min-width: 0;
  transition: grid-template-columns 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
body.ready #app { display: grid; }
body.ready #pair-view { display: none; }
body.collapsed #app { grid-template-columns: 0 1fr; }
body.collapsed #sidebar { visibility: hidden; }

#header {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}
#header .wordmark {
  font-family: var(--font-mono);
  font-size: 12.5px; font-weight: 600;
  letter-spacing: 0.02em;
}
#header .wordmark::after {
  content: "";
  display: inline-block;
  width: 1px; height: 14px;
  background: var(--border-strong);
  margin-left: 12px;
  vertical-align: -2px;
}
#header .repo {
  font-family: var(--font-mono);
  font-size: 12px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0; flex-shrink: 1;
}
#header .count {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--text-faint);
  white-space: nowrap;
}
#header .spacer { flex: 1; }
#header .code-pill {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--accent);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 3px 10px;
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  min-width: 0; flex-shrink: 1; max-width: 40vw;
}
#burger {
  background: none;
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  border-radius: var(--radius);
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}
#burger:hover { color: var(--text); border-color: var(--text-faint); }

#sidebar {
  display: flex; flex-direction: column;
  min-height: 0; min-width: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
}
#chips { display: flex; gap: 4px; padding: 10px 12px 0; }
.chip {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  padding: 5px 0 4px;
  cursor: pointer;
}
.chip:hover { color: var(--text); border-color: var(--text-faint); }
.chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
#search-wrap { padding: 8px 12px 10px; border-bottom: 1px solid var(--border); }
#search {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 10px;
  outline: none;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text-faint); }
#tree {
  flex: 1;
  overflow-y: auto;
  padding: 8px 6px 24px;
}
.t-node {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  cursor: pointer;
  user-select: none;
  border-radius: var(--radius);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-family: var(--font-mono);
  white-space: nowrap;
}
.t-node:hover { color: var(--text); }
.t-node .caret {
  width: 10px; flex-shrink: 0;
  color: var(--text-faint); font-size: 9px;
  transition: transform 0.15s;
}
.t-node.collapsed .caret { transform: rotate(-90deg); }
.t-node .t-count {
  margin-left: auto;
  color: var(--text-faint);
  font-size: 9.5px;
}
.t-node.collapsed + .t-children { display: none; }
.t-children { padding-left: 12px; }
.t-doc {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text);
  font-size: 13px;
  white-space: nowrap;
}
.t-doc:hover { background: var(--panel-2); }
.t-doc.active { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
.t-doc .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.t-doc .name .match { background: var(--accent-dim); color: var(--accent); border-radius: 2px; }
.t-doc .size {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
  opacity: 0;
  transition: opacity 0.12s;
}
.t-doc:hover .size, .t-doc.active .size { opacity: 1; }
#tree.flattened .t-node { display: none; }
#empty-search { display: none; padding: 32px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }
#empty-search .hint { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 6px; }
#empty-search.show { display: block; }

#reader {
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  background: var(--bg);
  overflow-x: hidden;
}
#crumbs {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-dim);
  min-height: 34px;
  min-width: 0;
  overflow: hidden;
}
#crumbs .sep { color: var(--text-faint); }
#crumbs .current { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#crumbs .doc-meta { margin-left: auto; display: flex; gap: 10px; color: var(--text-faint); font-size: 10.5px; white-space: nowrap; flex-shrink: 0; }
#content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 28px 56px;
  min-width: 0;
}
#content .empty {
  max-width: 460px;
  margin: 12vh auto 0;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}
#content .empty h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.doc-view { max-width: 640px; margin: 0 auto; }
.doc-view .file-title {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.doc-view .file-title .ft-name {
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.01em;
}
.doc-view .file-title .ft-meta {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--text-faint);
  margin-left: auto;
  white-space: nowrap;
}
.skeleton .sk-line { height: 12px; border-radius: 3px; background: var(--panel-2); margin-bottom: 10px; }
.skeleton .sk-line.w40 { width: 40%; }
.skeleton .sk-line.w70 { width: 70%; }
.skeleton .sk-line.w90 { width: 90%; }
.md h1 { font-size: 26px; font-weight: 650; margin: 0 0 12px; letter-spacing: -0.015em; line-height: 1.25; }
.md h2 { font-size: 17px; font-weight: 650; margin: 26px 0 8px; }
.md h3 { font-size: 14.5px; font-weight: 600; margin: 18px 0 6px; }
.md p { margin: 0 0 12px; line-height: 1.65; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin: 3px 0; line-height: 1.6; }
.md code {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.md pre {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px;
  overflow-x: auto;
  margin: 0 0 14px;
}
.md pre code { background: none; border: none; padding: 0; font-size: 12px; line-height: 1.6; }
.md blockquote { border-left: 3px solid var(--border-strong); padding: 2px 0 2px 14px; margin: 0 0 12px; color: var(--text-dim); }
.md hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
.md a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.md a:hover { text-decoration: underline; }
.md table { border-collapse: collapse; margin: 0 0 14px; font-size: 13px; width: 100%; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
.md th { background: var(--panel); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.plain {
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.7;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 70vh;
  overflow-y: auto;
}
.html-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  margin: 0 0 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.html-toggle .switch {
  position: relative;
  width: 32px; height: 17px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--panel-2);
  cursor: pointer;
  flex-shrink: 0;
}
.html-toggle .switch::after {
  content: "";
  position: absolute; top: 2px; left: 2px;
  width: 11px; height: 11px;
  border-radius: 999px;
  background: var(--text-dim);
  transition: transform 0.15s, background 0.15s;
}
.html-toggle .switch.on { background: var(--accent-dim); }
.html-toggle .switch.on::after { transform: translateX(15px); background: var(--accent); }
.html-frame {
  width: 100%; height: 68vh;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #ffffff;
}
.html-frame.themed { background: var(--panel); }
.bin-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 28px;
  max-width: 420px;
  margin: 8vh auto 0;
  text-align: center;
}
.bin-card .bin-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.bin-card .bin-note { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; }
.bin-card .bin-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 18px; }
.bin-card button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  padding: 8px 18px;
  cursor: pointer;
  letter-spacing: 0.02em;
}
.bin-card button:active { transform: scale(0.98); }

#statusbar {
  grid-column: 1 / -1;
  height: 26px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  display: flex; align-items: center; gap: 18px;
  padding: 0 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
  min-width: 0;
  overflow: hidden;
}
#statusbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#statusbar .sb-accent { color: var(--accent); }

#scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 40; }
#drawer-close { display: none; background: none; border: 1px solid var(--border-strong); color: var(--text-dim); border-radius: var(--radius); width: 30px; height: 30px; font-size: 12px; cursor: pointer; }
#drawer-close:hover { color: var(--text); border-color: var(--text-faint); }

@media (max-width: 767px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: min(320px, 84vw);
    z-index: 50;
    transform: translateX(-102%);
    transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 8px 0 32px rgba(0,0,0,0.3);
  }
  body.drawer-open #sidebar { transform: translateX(0); }
  body.drawer-open #scrim { display: block; }
  #drawer-close { display: block; position: absolute; top: 8px; right: 8px; z-index: 51; width: 34px; height: 34px; }
  #chips { padding-right: 48px; }
  #tree { padding-bottom: 84px; }
  .t-node, .t-doc { padding-top: 9px; padding-bottom: 9px; }
  .chip { padding-top: 8px; padding-bottom: 8px; font-size: 11px; }
  #search { font-size: 16px; padding: 9px 10px; }
  #pair-card input { font-size: 16px; padding: 12px; }
  #pair-card button { padding: 12px; font-size: 13px; }
  #content { padding: 20px 18px 80px; }
  #crumbs { padding: 8px 12px; }
  #crumbs .doc-meta { display: none; }
  #header { padding: 0 10px; gap: 8px; }
  #header .wordmark { display: none; }
  #burger { padding: 8px 10px; font-size: 11.5px; }
  #header .count { display: none; }
  #header .code-pill { font-size: 9.5px; padding: 4px 8px; max-width: 44vw; }
  #statusbar { gap: 10px; padding: 0 10px; font-size: 10px; }
  .md table { display: block; overflow-x: auto; white-space: nowrap; }
  .md pre { margin-left: -18px; margin-right: -18px; border-radius: 0; }
  .md h1 { font-size: 22px; line-height: 1.3; }
  #content .empty { padding: 0 8px; }
}
</style>
</head>
<body>

<div id="pair-view">
  <div id="pair-card">
    <h1>docscrying</h1>
    <p class="sub">Enter the pairing code from the box serving the docs</p>
    <input id="pair-input" type="text" placeholder="7-crossover-clockwork" autocomplete="off" spellcheck="false">
    <button id="pair-btn">pair</button>
    <div id="pair-error"></div>
  </div>
</div>

<div id="app">
  <header id="header">
    <button id="burger" aria-label="Toggle tree">TREE</button>
    <span class="wordmark">docscrying</span>
    <span class="repo" id="header-repo"></span>
    <span class="count" id="header-count"></span>
    <span class="spacer"></span>
    <span class="code-pill" id="header-code"></span>
  </header>
  <aside id="sidebar">
    <button id="drawer-close" aria-label="Close tree">&#10005;</button>
    <div id="chips">
      <button class="chip" data-scope="all">ALL</button>
      <button class="chip" data-scope="skills">SKILLS</button>
      <button class="chip active" data-scope="docs">DOCS</button>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="filter by filename" autocomplete="off" spellcheck="false">
    </div>
    <nav id="tree" aria-label="Document tree"></nav>
    <div id="empty-search">
      <div>No docs match</div>
      <div class="hint" id="empty-search-term"></div>
    </div>
  </aside>
  <main id="reader">
    <div id="crumbs"></div>
    <div id="content">
      <div class="empty">
        <h2>Nothing open</h2>
        <p>Pick a doc from the tree. Markdown and html render inline, rst/adoc/txt show as plain text, pdf/docx are downloads. Skill docs are hidden by default; hit SKILLS to see them.</p>
      </div>
    </div>
  </main>
  <div id="statusbar">
    <span id="sb-docs"></span>
    <span id="sb-paired"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="sb-code"></span>
  </div>
</div>

<div id="scrim"></div>

<script type="module">
import init, { pair, list_docs, get_doc, protocol_version, max_doc_size } from "./pkg/docscrying_wasm.js";

const $ = (id) => document.getElementById(id);
const state = {
  docs: [],
  selected: null,
  search: "",
  collapsed: {},
  htmlTheme: false,
  code: null,
  scope: "docs",
};

function fmtSize(n) {
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n >= 1024) return (n / 1024).toFixed(1) + " KB";
  return n + " B";
}
function dirOf(path) { const i = path.lastIndexOf("/"); return i === -1 ? "." : path.slice(0, i); }
function baseOf(path) { const i = path.lastIndexOf("/"); return i === -1 ? path : path.slice(i + 1); }
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

async function doPair() {
  const code = $("pair-input").value.trim();
  if (!code) return;
  const btn = $("pair-btn");
  const err = $("pair-error");
  btn.disabled = true;
  err.classList.remove("show");
  try {
    await pair(code);
    state.code = code;
    $("header-code").textContent = code;
    $("sb-code").textContent = code;
    const docs = await list_docs();
    state.docs = docs;
    renderTree();
    updateHeader();
    document.body.classList.add("ready");
  } catch (e) {
    err.textContent = String(e);
    err.classList.add("show");
  } finally {
    btn.disabled = false;
  }
}

function updateHeader() {
  const total = state.docs.reduce((a, d) => a + d.size, 0);
  $("header-count").textContent = state.docs.length + " docs / " + fmtSize(total);
  $("sb-docs").textContent = state.docs.length + " docs indexed";
  $("sb-paired").textContent = "paired via wormhole";
  const root = dirOf(state.docs[0] ? state.docs[0].path : ".");
  $("header-repo").textContent = root === "." ? "./" : "./" + root.split("/")[0];
}

function isSkillPath(path) {
  const parts = path.split("/");
  return parts.includes("skills") || parts.includes(".claude") || parts.includes(".agents");
}
function scopeFilter(docs) {
  if (state.scope === "all") return docs;
  if (state.scope === "skills") return docs.filter((d) => isSkillPath(d.path));
  return docs.filter((d) => !isSkillPath(d.path));
}

function highlight(name) {
  const q = state.search.trim();
  if (!q) return escapeHtml(name);
  const idx = name.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escapeHtml(name);
  return escapeHtml(name.slice(0, idx)) +
    '<span class="match">' + escapeHtml(name.slice(idx, idx + q.length)) + "</span>" +
    escapeHtml(name.slice(idx + q.length));
}

function renderTree() {
  const tree = $("tree");
  const empty = $("empty-search");
  const q = state.search.trim();
  const scoped = scopeFilter(state.docs);
  let list;
  if (q) {
    list = scoped.filter((d) => baseOf(d.path).toLowerCase().indexOf(q.toLowerCase()) !== -1);
  } else {
    list = scoped;
  }
  if (list.length === 0) {
    tree.innerHTML = "";
    $("empty-search-term").textContent = 'no doc filename contains "' + q + '"';
    empty.classList.add("show");
    return;
  }
  empty.classList.remove("show");
  tree.classList.toggle("flattened", !!q);
  let html = "";
  if (q) {
    list.slice().sort((a, b) => (a.path < b.path ? -1 : 1)).forEach((d) => {
      html += '<div class="t-doc' + (state.selected === d.id ? " active" : "") +
        '" data-id="' + d.id + '"><span class="name">' + highlight(baseOf(d.path)) +
        '</span><span class="size">' + fmtSize(d.size) + "</span></div>";
    });
    tree.innerHTML = html;
    return;
  }
  // build nested tree
  const root = { name: "", dirs: {}, docs: [] };
  list.forEach((d) => {
    const parts = dirOf(d.path) === "." ? [] : dirOf(d.path).split("/").filter(Boolean);
    let node = root;
    parts.forEach((p) => {
      node = (node.dirs[p] = node.dirs[p] || { name: p, dirs: {}, docs: [] });
    });
    node.docs.push(d);
  });
  const open = (node) => !state.collapsed[node.key];
  const walk = (node, isRoot) => {
    const dirNames = Object.keys(node.dirs).sort((a, b) => (a < b ? -1 : 1));
    const docList = node.docs.slice().sort((a, b) => (baseOf(a.path) < baseOf(b.path) ? -1 : 1));
    let out = "";
    const renderDocs = () => {
      docList.forEach((d) => {
        out += '<div class="t-doc' + (state.selected === d.id ? " active" : "") +
          '" data-id="' + d.id + '"><span class="name">' + escapeHtml(baseOf(d.path)) +
          '</span><span class="size">' + fmtSize(d.size) + "</span></div>";
      });
    };
    if (isRoot) renderDocs(); // entry docs first, then dirs
    dirNames.forEach((name) => {
      const child = node.dirs[name];
      child.key = (node.key || "") + "/" + name;
      const n = child.docs.length + Object.keys(child.dirs).reduce((a, k) => a + child.dirs[k].docs.length + Object.keys(child.dirs[k].dirs).length, 0);
      out += '<div class="t-node' + (open(child) ? "" : " collapsed") + '" data-key="' + escapeHtml(child.key) + '">' +
        '<span class="caret">&#9662;</span>' + escapeHtml(name) +
        '<span class="t-count">' + n + "</span></div>";
      out += '<div class="t-children">' + walk(child, false) + "</div>";
    });
    if (!isRoot) renderDocs();
    return out;
  };
  html = walk(root, true);
  tree.innerHTML = html;
}

function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let inPre = false, inList = false, inQuote = false, listType = "ul";
  function closeList() { if (inList) { html += "</" + listType + ">"; inList = false; } }
  function closeQuote() { if (inQuote) { html += "</blockquote>"; inQuote = false; } }
  function inline(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith("```")) {
      closeList(); closeQuote();
      if (inPre) { html += "</code></pre>"; inPre = false; }
      else { html += "<pre><code>"; inPre = true; }
      continue;
    }
    if (inPre) { html += escapeHtml(line) + "\n"; continue; }
    if (!t) { closeList(); closeQuote(); html += "\n"; continue; }
    if (t.startsWith("### ")) { closeList(); closeQuote(); html += "<h3>" + inline(t.slice(4)) + "</h3>"; continue; }
    if (t.startsWith("## ")) { closeList(); closeQuote(); html += "<h2>" + inline(t.slice(3)) + "</h2>"; continue; }
    if (t.startsWith("# ")) { closeList(); closeQuote(); html += "<h1>" + inline(t.slice(2)) + "</h1>"; continue; }
    if (t.startsWith("> ")) { closeList(); if (!inQuote) { html += "<blockquote>"; inQuote = true; } html += "<p>" + inline(t.slice(2)) + "</p>"; continue; }
    if (/^[-*] /.test(t)) {
      closeQuote();
      if (!inList || listType !== "ul") { closeList(); html += "<ul>"; inList = true; listType = "ul"; }
      html += "<li>" + inline(t.replace(/^[-*] /, "")) + "</li>"; continue;
    }
    if (/^\d+\. /.test(t)) {
      closeQuote();
      if (!inList || listType !== "ol") { closeList(); html += "<ol>"; inList = true; listType = "ol"; }
      html += "<li>" + inline(t.replace(/^\d+\. /, "")) + "</li>"; continue;
    }
    if (/^-{3,}$/.test(t)) { closeList(); closeQuote(); html += "<hr>"; continue; }
    closeList(); closeQuote();
    html += "<p>" + inline(t) + "</p>";
  }
  closeList(); closeQuote();
  if (inPre) html += "</code></pre>";
  return html;
}

async function openDoc(id) {
  const doc = state.docs.find((d) => d.id === id);
  if (!doc) return;
  state.selected = id;
  renderTree();
  const content = $("content");
  const crumbs = $("crumbs");
  const dir = dirOf(doc.path);
  crumbs.innerHTML = '<span class="sep">/</span><span class="current">' + escapeHtml(doc.path) + "</span>" +
    '<span class="doc-meta">' + fmtSize(doc.size) + "</span>";
  content.innerHTML = '<div class="doc-view skeleton"><div class="sk-line w70"></div><div class="sk-line w90"></div><div class="sk-line w40"></div></div>';

  if (doc.size >= max_doc_size()) {
    content.innerHTML = '<div class="doc-view"><div class="bin-card"><div class="bin-name">' + escapeHtml(baseOf(doc.path)) +
      '</div><div class="bin-note">This doc is over the 25 MB transfer cap.</div>' +
      '<div class="bin-meta">' + fmtSize(doc.size) + "</div></div></div>";
    return;
  }

  try {
    const res = await get_doc(id);
    const bytes = res.bytes ? new Uint8Array(res.bytes) : null;
    const kind = doc.kind;
    let inner = "";
    if (res.status !== 200) {
      inner = '<div class="bin-card"><div class="bin-name">' + escapeHtml(baseOf(doc.path)) +
        '</div><div class="bin-note">' + escapeHtml(res.error || ("status " + res.status)) + "</div></div>";
    } else if (kind === "md" || kind === "readme") {
      const text = new TextDecoder().decode(bytes);
      inner = '<div class="md">' + renderMarkdown(text) + "</div>";
    } else if (kind === "html") {
      const text = new TextDecoder().decode(bytes);
      inner = '<div class="html-toggle">theme <span class="switch' + (state.htmlTheme ? " on" : "") + '" id="html-switch"></span></div>' +
        '<iframe class="html-frame' + (state.htmlTheme ? " themed" : "") + '" sandbox="allow-same-origin" srcdoc="' + escapeHtml(text) + '"></iframe>';
    } else if (kind === "pdf" || kind === "docx") {
      const blob = new Blob([bytes], { type: res.content_type || "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      inner = '<div class="bin-card"><div class="bin-name">' + escapeHtml(baseOf(doc.path)) +
        '</div><div class="bin-note">Not previewable inline; download to read.</div>' +
        '<div class="bin-meta">' + fmtSize(doc.size) + "</div>" +
        '<button id="download-btn">download</button></div>';
      setTimeout(() => {
        const btn = $("download-btn");
        if (btn) btn.onclick = () => { const a = document.createElement("a"); a.href = url; a.download = baseOf(doc.path); a.click(); };
      }, 0);
    } else {
      const text = new TextDecoder().decode(bytes);
      inner = '<div class="plain">' + escapeHtml(text) + "</div>";
    }
    content.innerHTML = '<div class="doc-view">' +
      '<div class="file-title"><span class="ft-name">' + escapeHtml(baseOf(doc.path)) +
      '</span><span class="ft-meta">' + fmtSize(doc.size) + " / " + kind + "</span></div>" + inner + "</div>";
    const sw = $("html-switch");
    if (sw) sw.onclick = () => {
      state.htmlTheme = !state.htmlTheme;
      openDoc(id);
    };
  } catch (e) {
    content.innerHTML = '<div class="doc-view"><div class="bin-card"><div class="bin-name">Fetch failed</div><div class="bin-note">' + escapeHtml(String(e)) + "</div></div></div>";
  }
}

$("pair-btn").onclick = doPair;
$("pair-input").addEventListener("keydown", (e) => { if (e.key === "Enter") doPair(); });
$("search").addEventListener("input", () => { state.search = $("search").value; renderTree(); });
document.querySelectorAll("#chips .chip").forEach((chip) => {
  chip.onclick = () => {
    state.scope = chip.dataset.scope;
    document.querySelectorAll("#chips .chip").forEach((c) => c.classList.toggle("active", c === chip));
    renderTree();
  };
});
$("tree").addEventListener("click", (e) => {
  const row = e.target.closest(".t-doc");
  if (row) {
    openDoc(Number(row.dataset.id));
    if (window.innerWidth <= 767) document.body.classList.remove("drawer-open");
    return;
  }
  const node = e.target.closest(".t-node");
  if (node) {
    const key = node.dataset.key;
    state.collapsed[key] = !state.collapsed[key];
    renderTree();
  }
});
$("burger").onclick = () => {
  if (window.innerWidth <= 767) {
    document.body.classList.toggle("drawer-open");
  } else {
    document.body.classList.toggle("collapsed");
  }
};
$("drawer-close").onclick = () => document.body.classList.remove("drawer-open");
$("scrim").onclick = () => document.body.classList.remove("drawer-open");

await init();
console.log("docscrying reader: protocol v" + protocol_version());

// Direct-link pairing: ?code=<pairing-code> auto-fills and pairs on load.
(function autoPairFromUrl() {
  const code = new URLSearchParams(location.search).get("code");
  if (!code) return;
  $("pair-input").value = code;
  doPair().then(() => {
    // Strip the code from the URL after a successful pair: it is one-shot,
    // so a refresh would re-attempt with a consumed code and fail.
    history.replaceState(null, "", location.pathname);
  }).catch(() => {
    // Leave the (bad/expired) code in the input, but drop the param so
    // refresh doesn't re-attempt a doomed pair.
    history.replaceState(null, "", location.pathname);
  });
})();
