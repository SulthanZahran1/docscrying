[package]
name = "scry-wasm"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "scry reader WASM client: pair via magic-wormhole, read docs over relay-v1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fork-pinned: crates.io 0.8.1 panics on wasm32 (un-gated std::time::Instant
# in transit.rs). This fork gates that code behind a wasm-time cfg.
magic-wormhole = { git = "https://github.com/lucamartinetti/magic-wormhole.rs", rev = "b695a1d79138d802391125f4ebbc463b80737974", features = ["transit", "transfer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window"] }
serde-wasm-bindgen = "0.6"
futures = "0.3"
console_error_panic_hook = "0.1"
