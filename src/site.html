<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scry reader</title>
<style>
/* scry reader site. One desaturated accent, mono data, no badges. */
:root {
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --bg: #0e0e10;
  --panel: #17171b;
  --panel-2: #1d1d22;
  --border: #26262e;
  --border-strong: #3a3a44;
  --text: #dcdce2;
  --text-dim: #a3a3ad;
  --text-faint: #7a7a85;
  --accent: #c9973e;
  --accent-dim: rgba(201, 151, 62, 0.16);
  --skeleton: #1d1d22;
  --radius: 4px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#app {
  display: grid;
  grid-template-columns: 320px 1fr;
  grid-template-rows: 44px 1fr 26px;
  height: 100vh;
  height: 100dvh;
  transition: grid-template-columns 0.2s var(--ease);
}
body.collapsed #app { grid-template-columns: 0 1fr; }
body.collapsed #sidebar { visibility: hidden; }
body.collapsed #search { visibility: hidden; }

/* header */
#header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 44px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
#header .wordmark {
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.02em;
}
#header .wordmark::after {
  content: "";
  display: inline-block;
  width: 1px;
  height: 14px;
  background: var(--border-strong);
  margin-left: 12px;
  vertical-align: -2px;
}
#header .repo {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#header .count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  white-space: nowrap;
}
#header .spacer { flex: 1; }
#header .code-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 3px 10px;
  letter-spacing: 0.03em;
  white-space: nowrap;
  cursor: default;
}
#burger {
  background: none;
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  border-radius: var(--radius);
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}
#burger:hover { color: var(--text); border-color: var(--text-faint); }

/* sidebar */
#sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
}
#search-wrap { padding: 10px 12px; border-bottom: 1px solid var(--border); }
#search {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 10px;
  outline: none;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text-faint); }
#tree {
  flex: 1;
  overflow-y: auto;
  padding: 8px 6px 24px;
}
.dir-group { margin-bottom: 2px; }
.dir-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  cursor: pointer;
  user-select: none;
  border-radius: var(--radius);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.dir-head:hover { color: var(--text); }
.dir-head .caret { width: 10px; color: var(--text-faint); transition: transform 0.15s var(--ease); font-size: 9px; }
.dir-group.collapsed .caret { transform: rotate(-90deg); }
.dir-group.collapsed .dir-children { display: none; }
.dir-children { padding-left: 12px; }
.doc-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text);
  font-size: 13px;
  white-space: nowrap;
}
.doc-row:hover { background: var(--panel-2); }
.doc-row:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
.doc-row.active { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
.doc-row.active:hover { background: var(--accent-dim); }
.doc-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.doc-row .size {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
  opacity: 0;
  transition: opacity 0.12s var(--ease);
}
.doc-row:hover .size, .doc-row.active .size { opacity: 1; }
.doc-row .name .match { background: var(--accent-dim); color: var(--accent); border-radius: 2px; }
#empty-search {
  display: none;
  padding: 32px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}
#empty-search .hint { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 6px; }
#empty-search.show { display: block; }

/* reader pane */
#reader {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
}
#crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-dim);
  min-height: 34px;
}
#crumbs .seg { color: var(--text-dim); }
#crumbs .seg.root { color: var(--text-faint); }
#crumbs .sep { color: var(--text-faint); }
#crumbs .seg.current { color: var(--text); }
#crumbs .doc-meta {
  margin-left: auto;
  display: flex;
  gap: 10px;
  color: var(--text-faint);
  font-size: 10.5px;
}
#content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px 56px;
}
#content .empty {
  max-width: 460px;
  margin: 12vh auto 0;
  text-align: center;
  color: var(--text-dim);
}
#content .empty h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
#content .empty p { font-size: 13px; }
.doc-view { max-width: 640px; margin: 0 auto; }
.doc-view .file-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.doc-view .file-title .ft-name {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.01em;
}
.doc-view .file-title .ft-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  margin-left: auto;
  white-space: nowrap;
}

/* markdown */
.md h1 { font-size: 26px; font-weight: 650; margin: 0 0 12px; letter-spacing: -0.015em; line-height: 1.25; }
.md h2 { font-size: 17px; font-weight: 650; margin: 26px 0 8px; }
.md h3 { font-size: 14.5px; font-weight: 600; margin: 18px 0 6px; }
.md p { margin: 0 0 12px; line-height: 1.65; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin: 3px 0; line-height: 1.6; }
.md code {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
}
.md pre {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px;
  overflow-x: auto;
  margin: 0 0 14px;
}
.md pre code { background: none; border: none; padding: 0; font-size: 12px; line-height: 1.6; }
.md blockquote {
  border-left: 3px solid var(--border-strong);
  padding: 2px 0 2px 14px;
  margin: 0 0 12px;
  color: var(--text-dim);
}
.md hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md table { border-collapse: collapse; margin: 0 0 14px; font-size: 13px; width: 100%; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
.md th { background: var(--panel); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }

/* plain text docs */
.plain {
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.7;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 70vh;
  overflow-y: auto;
}

/* html doc */
.html-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.html-toggle .switch {
  position: relative;
  width: 32px;
  height: 17px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--panel-2);
  cursor: pointer;
  transition: background 0.15s var(--ease);
  flex-shrink: 0;
}
.html-toggle .switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 11px;
  height: 11px;
  border-radius: 999px;
  background: var(--text-dim);
  transition: transform 0.15s var(--ease), background 0.15s var(--ease);
}
.html-toggle .switch.on { background: var(--accent-dim); }
.html-toggle .switch.on::after { transform: translateX(15px); background: var(--accent); }
.html-frame {
  width: 100%;
  height: 68vh;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #ffffff;
}
.html-frame.themed { border-color: var(--border); background: var(--panel); }

/* download and error cards */
.bin-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 28px;
  max-width: 420px;
  margin: 8vh auto 0;
  text-align: center;
}
.bin-card .bin-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.bin-card .bin-note { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; }
.bin-card .bin-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 18px; }
.bin-card .dl {
  display: inline-block;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 18px;
  cursor: pointer;
  letter-spacing: 0.02em;
  text-decoration: none;
}
.bin-card .dl:active { transform: scale(0.98); }
.err-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 28px;
  max-width: 420px;
  margin: 8vh auto 0;
  text-align: center;
}
.err-card .err-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.err-card .err-note { font-size: 12.5px; color: var(--text-dim); }
.err-card .err-code { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); margin-bottom: 12px; }

/* skeleton */
.skeleton .sk-line { height: 12px; border-radius: 3px; background: var(--skeleton); margin-bottom: 10px; }
.skeleton .sk-line.w40 { width: 40%; }
.skeleton .sk-line.w70 { width: 70%; }
.skeleton .sk-line.w90 { width: 90%; }
.skeleton .sk-line.w55 { width: 55%; }

/* status bar */
#statusbar {
  grid-column: 1 / -1;
  height: 26px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
}
#statusbar .sb-accent { color: var(--accent); }
#statusbar .spacer { flex: 1; }

/* mobile */
#scrim { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 40; }
@media (max-width: 767px) {
  #app { grid-template-columns: 1fr; }
  #sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(320px, 84vw);
    z-index: 50;
    transform: translateX(-102%);
    transition: transform 0.22s var(--ease);
    box-shadow: 8px 0 32px rgba(0, 0, 0, 0.3);
  }
  body.drawer-open #sidebar { transform: translateX(0); }
  body.drawer-open #scrim { display: block; }
  #content { padding: 20px 18px 80px; }
  #crumbs { padding: 8px 12px; }
  #crumbs .doc-meta { display: none; }
}
</style>
</head>
<body>

<div id="app">
  <header id="header">
    <button id="burger" aria-label="Toggle tree">TREE</button>
    <span class="wordmark">scry</span>
    <span class="repo" id="header-repo">__SCRY_REPO__</span>
    <span class="count" id="header-count"></span>
    <span class="spacer"></span>
    <span class="code-pill" id="header-code" title="Pairing code: the reader enters this to connect">__SCRY_CODE__</span>
  </header>

  <aside id="sidebar">
    <div id="search-wrap">
      <input id="search" type="text" placeholder="filter by filename" autocomplete="off" spellcheck="false">
    </div>
    <nav id="tree" aria-label="Document tree"></nav>
    <div id="empty-search">
      <div>No docs match</div>
      <div class="hint" id="empty-search-term"></div>
    </div>
  </aside>

  <main id="reader">
    <div id="crumbs"></div>
    <div id="content">
      <div class="empty">
        <h2>Nothing open</h2>
        <p>Pick a doc from the tree. The reader renders markdown and html inline, shows plain text for rst, adoc and txt, and lists pdf and docx as downloadable files.</p>
      </div>
    </div>
  </main>

  <div id="statusbar">
    <span id="sb-docs"></span>
    <span id="sb-selected"></span>
    <span class="spacer"></span>
    <span id="sb-code"></span>
    <span id="sb-paired"></span>
  </div>
</div>

<div id="scrim"></div>

<script>
"use strict";
/* ------------------------------------------------------------------
   State
   ------------------------------------------------------------------ */
var state = {
  docs: [],
  selected: null,
  search: "",
  collapsed: {},
  loading: false,
  htmlTheme: false
};
var PAIRING_CODE = document.getElementById("header-code").textContent;

/* ------------------------------------------------------------------
   Helpers
   ------------------------------------------------------------------ */
function fmtSize(n) {
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n >= 1024) return (n / 1024).toFixed(1) + " KB";
  return n + " B";
}
function fmtTime(t) {
  var d = new Date(t * 1000);
  return d.toISOString().replace("T", " ").slice(0, 16);
}
function dirOf(path) {
  var i = path.lastIndexOf("/");
  return i === -1 ? "." : path.slice(0, i);
}
function baseOf(path) {
  var i = path.lastIndexOf("/");
  return i === -1 ? path : path.slice(i + 1);
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
}
function docById(id) {
  for (var i = 0; i < state.docs.length; i++) {
    if (state.docs[i].id === id) return state.docs[i];
  }
  return null;
}

/* ------------------------------------------------------------------
   Tree rendering
   ------------------------------------------------------------------ */
function groupDocs(docs) {
  var groups = {};
  docs.forEach(function (d) {
    var dir = dirOf(d.path);
    (groups[dir] = groups[dir] || []).push(d);
  });
  var order = Object.keys(groups).sort(function (a, b) {
    if (a === ".") return -1;
    if (b === ".") return 1;
    return a < b ? -1 : 1;
  });
  return order.map(function (dir) { return { dir: dir, docs: groups[dir] }; });
}

function highlight(name) {
  var q = state.search.trim();
  if (!q) return escapeHtml(name);
  var idx = name.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escapeHtml(name);
  return escapeHtml(name.slice(0, idx)) +
    '<span class="match">' + escapeHtml(name.slice(idx, idx + q.length)) + "</span>" +
    escapeHtml(name.slice(idx + q.length));
}

function renderTree() {
  var tree = document.getElementById("tree");
  var empty = document.getElementById("empty-search");
  var q = state.search.trim();
  var list;

  if (q) {
    list = state.docs.filter(function (d) { return baseOf(d.path).toLowerCase().indexOf(q.toLowerCase()) !== -1; });
  } else {
    list = state.docs;
  }

  if (list.length === 0) {
    tree.innerHTML = "";
    document.getElementById("empty-search-term").textContent = 'no doc filename contains "' + q + '"';
    empty.classList.add("show");
    return;
  }
  empty.classList.remove("show");

  var html = "";
  if (q) {
    list.slice().sort(function (a, b) { return a.path < b.path ? -1 : 1; }).forEach(function (d) {
      html += '<div class="doc-row' + (state.selected === d.id ? " active" : "") +
        '" data-id="' + d.id + '" tabindex="0">' +
        '<span class="name">' + highlight(baseOf(d.path)) + "</span>" +
        '<span class="size">' + fmtSize(d.size) + "</span></div>";
    });
  } else {
    groupDocs(list).forEach(function (g) {
      var collapsed = !!state.collapsed[g.dir];
      html += '<div class="dir-group' + (collapsed ? " collapsed" : "") + '" data-dir="' + escapeHtml(g.dir) + '">' +
        '<div class="dir-head"><span class="caret">&#9662;</span>' + (g.dir === "." ? "root" : escapeHtml(g.dir)) + "</div>" +
        '<div class="dir-children">';
      g.docs.forEach(function (d) {
        html += '<div class="doc-row' + (state.selected === d.id ? " active" : "") +
          '" data-id="' + d.id + '" tabindex="0">' +
          '<span class="name">' + escapeHtml(baseOf(d.path)) + "</span>" +
          '<span class="size">' + fmtSize(d.size) + "</span></div>";
      });
      html += "</div></div>";
    });
  }
  tree.innerHTML = html;
}

function updateHeaderCount() {
  var total = state.docs.reduce(function (a, d) { return a + d.size; }, 0);
  document.getElementById("header-count").textContent = state.docs.length + " docs / " + fmtSize(total);
  document.getElementById("sb-docs").textContent = state.docs.length + " docs indexed";
  document.getElementById("sb-code").textContent = PAIRING_CODE;
}

/* ------------------------------------------------------------------
   Markdown rendering (hand-rolled, ported from the prototype)
   ------------------------------------------------------------------ */
function renderMarkdown(src) {
  var lines = src.replace(/\r\n/g, "\n").split("\n");
  var html = "";
  var inPre = false, inList = false, inQuote = false, listType = "ul";
  var i = 0;

  function closeList() {
    if (inList) { html += "</" + listType + ">"; inList = false; }
  }
  function closeQuote() {
    if (inQuote) { html += "</blockquote>"; inQuote = false; }
  }

  for (i = 0; i < lines.length; i++) {
    var line = lines[i];
    var t = line.trim();

    if (t.startsWith("```")) {
      closeList(); closeQuote();
      if (inPre) { html += "</code></pre>"; inPre = false; }
      else { html += "<pre><code>"; inPre = true; }
      continue;
    }
    if (inPre) { html += escapeHtml(line) + "\n"; continue; }

    if (!t) { closeList(); closeQuote(); html += "\n"; continue; }

    if (t.startsWith("### ")) { closeList(); closeQuote(); html += "<h3>" + inline(t.slice(4)) + "</h3>"; continue; }
    if (t.startsWith("## ")) { closeList(); closeQuote(); html += "<h2>" + inline(t.slice(3)) + "</h2>"; continue; }
    if (t.startsWith("# ")) { closeList(); closeQuote(); html += "<h1>" + inline(t.slice(2)) + "</h1>"; continue; }
    if (t.startsWith("> ")) { closeList(); if (!inQuote) { html += "<blockquote>"; inQuote = true; } html += "<p>" + inline(t.slice(2)) + "</p>"; continue; }
    if (/^[-*] /.test(t)) {
      closeQuote();
      if (!inList || listType !== "ul") { closeList(); html += "<ul>"; inList = true; listType = "ul"; }
      html += "<li>" + inline(t.replace(/^[-*] /, "")) + "</li>"; continue;
    }
    if (/^\d+\. /.test(t)) {
      closeQuote();
      if (!inList || listType !== "ol") { closeList(); html += "<ol>"; inList = true; listType = "ol"; }
      html += "<li>" + inline(t.replace(/^\d+\. /, "")) + "</li>"; continue;
    }
    if (/^-{3,}$/.test(t)) { closeList(); closeQuote(); html += "<hr>"; continue; }
    if (t.startsWith("|")) {
      closeList(); closeQuote();
      var cells = t.split("|").slice(1, -1).map(function (c) { return c.trim(); });
      var isHeader = cells.every(function (c) { return /^:?-{2,}:?$/.test(c); });
      if (isHeader) continue;
      html += "<tr>" + cells.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
      continue;
    }
    closeList(); closeQuote();
    html += "<p>" + inline(t) + "</p>";
  }
  closeList(); closeQuote();
  if (inPre) html += "</code></pre>";
  return html;
}

function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}

function wrapThemedHtml(body) {
  var cs = getComputedStyle(document.body);
  var bg = cs.getPropertyValue("--bg").trim();
  var text = cs.getPropertyValue("--text").trim();
  var dim = cs.getPropertyValue("--text-dim").trim();
  var accent = cs.getPropertyValue("--accent").trim();
  var border = cs.getPropertyValue("--border").trim();
  var sans = cs.getPropertyValue("--font-sans").trim();
  var mono = cs.getPropertyValue("--font-mono").trim();
  return "<style>" +
    "html,body{background:" + bg + ";color:" + text + ";" +
    "font-family:" + sans + ";max-width:760px;margin:0 auto;padding:28px 24px;line-height:1.6;font-size:14px}" +
    "a{color:" + accent + "}" +
    "code,pre{font-family:" + mono + ";font-size:12.5px}" +
    "pre{background:" + bg + ";border:1px solid " + border + ";padding:10px 12px;overflow-x:auto}" +
    "th,td{border:1px solid " + border + ";padding:4px 8px;text-align:left}" +
    "th{color:" + dim + "}" +
    "h1,h2,h3{line-height:1.25}" +
    "</style>" + body;
}

/* ------------------------------------------------------------------
   Doc rendering
   ------------------------------------------------------------------ */
function renderDoc(d, body, contentType) {
  var view = document.createElement("div");
  view.className = "doc-view";
  var ft = '<div class="file-title"><span class="ft-name">' + escapeHtml(baseOf(d.path)) + "</span>" +
    '<span class="ft-meta">doc ' + d.id + " / " + fmtSize(d.size) + " / " + fmtTime(d.mtime) + "</span></div>";

  var inner = "";
  if (contentType === "text/markdown") {
    inner = ft + '<div class="md">' + renderMarkdown(body) + "</div>";
  } else if (contentType === "text/html") {
    var themed = state.htmlTheme;
    var docHtml = themed ? wrapThemedHtml(body) : body;
    inner = ft +
      '<div class="html-toggle" title="On: doc follows scry styling. Off: doc keeps its own css.">' +
      '<span class="switch' + (themed ? " on" : "") + '" id="html-theme-switch" role="switch" aria-checked="' + themed + '"></span>' +
      "<span>scry theme</span></div>" +
      '<iframe class="html-frame' + (themed ? " themed" : "") + '" title="' + escapeHtml(baseOf(d.path)) + '" srcdoc="' + escapeHtml(docHtml).replace(/"/g, "&quot;") + '"></iframe>';
  } else if (contentType === "application/pdf" || contentType === "application/vnd.openxmlformats-officedocument.wordprocessingml.document") {
    inner = '<div class="bin-card">' +
      '<div class="bin-name">' + escapeHtml(baseOf(d.path)) + "</div>" +
      '<div class="bin-note">Not previewable inline. Download to read.</div>' +
      '<div class="bin-meta">' + fmtSize(d.size) + " / " + fmtTime(d.mtime) + " / doc " + d.id + "</div>" +
      '<a class="dl" href="/api/doc/' + d.id + '" download="' + escapeHtml(baseOf(d.path)) + '">Download</a></div>';
  } else {
    inner = ft + '<div class="plain">' + escapeHtml(body) + "</div>";
  }
  view.innerHTML = inner;
  return view;
}

function renderError(title, note, code) {
  var view = document.createElement("div");
  view.className = "doc-view";
  view.innerHTML = '<div class="err-card">' +
    '<div class="err-code">' + code + "</div>" +
    '<div class="err-title">' + escapeHtml(title) + "</div>" +
    '<div class="err-note">' + escapeHtml(note) + "</div></div>";
  return view;
}

function renderSkeleton() {
  var el = document.createElement("div");
  el.className = "doc-view skeleton";
  el.innerHTML = '<div class="sk-line w40"></div><div class="sk-line w70"></div>' +
    '<div class="sk-line w90"></div><div class="sk-line w55"></div>' +
    '<div class="sk-line w90"></div><div class="sk-line w70"></div>';
  return el;
}

function updateCrumbs(d) {
  var crumbs = document.getElementById("crumbs");
  var segs = d.path.split("/");
  var html = '<span class="seg root">' + escapeHtml(document.getElementById("header-repo").textContent) + "</span>";
  segs.forEach(function (s, i) {
    html += '<span class="sep">/</span>';
    html += i === segs.length - 1
      ? '<span class="seg current">' + escapeHtml(s) + "</span>"
      : '<span class="seg">' + escapeHtml(s) + "</span>";
  });
  html += '<span class="doc-meta"><span>' + fmtSize(d.size) + "</span><span>" + fmtTime(d.mtime) + "</span></span>";
  crumbs.innerHTML = html;
  document.getElementById("sb-selected").textContent = baseOf(d.path);
}

function selectDoc(id) {
  var d = docById(id);
  if (!d || state.loading) return;
  state.selected = id;
  state.loading = true;

  renderTree();
  updateCrumbs(d);

  var content = document.getElementById("content");
  content.innerHTML = "";
  content.appendChild(renderSkeleton());

  fetch("/api/doc/" + id).then(function (res) {
    state.loading = false;
    var contentType = res.headers.get("content-type") || "";
    if (res.status === 200) {
      return res.text().then(function (body) {
        var view = renderDoc(d, body, contentType);
        content.innerHTML = "";
        content.appendChild(view);
      });
    }
    return res.json().then(function (err) {
      var view;
      if (res.status === 413) {
        view = renderError("Doc too large to transfer",
          "This doc is over the 25 MB transfer cap. It is indexed but cannot be opened remotely.",
          "413");
      } else if (res.status === 404) {
        view = renderError("Doc not found",
          "It may have been removed after the index was built.",
          "404");
      } else if (res.status === 500) {
        view = renderError("Could not read this doc",
          "The server reported a read failure.",
          "500");
      } else {
        view = renderError("Request failed", (err && err.error) || "Unknown error", String(res.status));
      }
      content.innerHTML = "";
      content.appendChild(view);
    });
  }).catch(function () {
    state.loading = false;
    var view = renderError("The pairing pipe is closed",
      "This session ended. Re-run scry open with a fresh code to reconnect.",
      "DISCONNECTED");
    content.innerHTML = "";
    content.appendChild(view);
  });
}

/* ------------------------------------------------------------------
   Events
   ------------------------------------------------------------------ */
document.getElementById("tree").addEventListener("click", function (e) {
  var head = e.target.closest(".dir-head");
  if (head) {
    var dir = head.parentElement.getAttribute("data-dir");
    state.collapsed[dir] = !state.collapsed[dir];
    renderTree();
    return;
  }
  var row = e.target.closest(".doc-row");
  if (row) selectDoc(parseInt(row.getAttribute("data-id"), 10));
});

document.getElementById("tree").addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  var row = e.target.closest(".doc-row");
  if (row) selectDoc(parseInt(row.getAttribute("data-id"), 10));
});

document.getElementById("search").addEventListener("input", function (e) {
  state.search = e.target.value;
  renderTree();
});

document.getElementById("search").addEventListener("keydown", function (e) {
  if (e.key === "Escape") { e.target.value = ""; state.search = ""; renderTree(); }
});

document.getElementById("content").addEventListener("click", function (e) {
  var sw = e.target.closest("#html-theme-switch");
  if (!sw) return;
  state.htmlTheme = !state.htmlTheme;
  if (state.selected !== null) {
    var d = docById(state.selected);
    if (d) selectDoc(d.id);
  }
});

document.getElementById("burger").addEventListener("click", function () {
  if (window.innerWidth <= 767) {
    document.body.classList.toggle("drawer-open");
  } else {
    document.body.classList.toggle("collapsed");
    updateBurgerLabel();
  }
});
document.getElementById("scrim").addEventListener("click", function () {
  document.body.classList.remove("drawer-open");
});

function updateBurgerLabel() {
  var collapsed = document.body.classList.contains("collapsed");
  document.getElementById("burger").textContent = collapsed ? "SHOW" : "TREE";
}
updateBurgerLabel();

/* ------------------------------------------------------------------
   Init
   ------------------------------------------------------------------ */
fetch("/api/tree").then(function (res) {
  return res.json();
}).then(function (data) {
  state.docs = data.docs || [];
  updateHeaderCount();
  renderTree();
  if (state.docs.length > 0) {
    selectDoc(state.docs[0].id);
  }
}).catch(function () {
  document.getElementById("sb-paired").textContent = "unreachable";
  document.getElementById("sb-paired").classList.add("sb-accent");
});
</script>
</body>
</html>
